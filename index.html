            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #eee;
            padding: 8px;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
        }

        .delete {
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
            padding: 4px 6px;
        }
    </style>
</head>
